name: Release

# Publishing a GitHub Release (tag vX.Y.Z matching Cargo.toml) builds Sottovoce.app with the server inside, signs it
# with a Developer ID, notarizes and staples it (app/package.sh), and attaches the DMG and its checksum to the Release.
# A manual run builds the same DMG as a workflow artifact without touching any Release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build; publishing requires an existing Release tag such as v0.1.0
        required: true
        default: main
        type: string
      publish:
        description: Attach the DMG to the Release named by ref
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.ref }}
      PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check signing credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. An unnotarized DMG would be refused by Gatekeeper, so nothing is built."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - name: Check the version against the Release
        if: env.PUBLISH == 'true'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match Cargo.toml version $version"
            exit 1
          fi
      # MLX compiles its Metal kernels during the build; Xcode 26 ships the Metal compiler as a separate component
      - name: Install the Metal toolchain
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - uses: dtolnay/rust-toolchain@stable
      - name: Import the Developer ID certificate into a temporary keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/sottovoce.keychain-db"
          pass=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain" > /dev/null
          # Keep the existing keychains searched as well: the unquoted list splits into one path per argument
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          test -n "$identity"
          echo "SOTTOVOCE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      # Every run compiles MLX from source. There is no target cache: rust-cache prunes unknown directories such as
      # target/app/metal but keeps mlx-sys's build output, so the step that writes the metallib would never run again
      - name: Build, sign and notarize
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          app/package.sh
          rm "$APPLE_API_KEY_PATH"
          cd app/build
          shasum -a 256 Sottovoce-*.dmg > Sottovoce.sha256
          cat Sottovoce.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: sottovoce-dmg
          path: |
            app/build/Sottovoce-*.dmg
            app/build/Sottovoce.sha256
          if-no-files-found: error
          retention-days: 30
      # A retry keeps a DMG already attached instead of replacing a published one; a changed app needs a new version.
      # The rebuilt DMG differs (signing and notarization timestamps), so the checksum is always taken from the DMG
      # the Release ends up with, and replaces one an earlier attempt may have attached
      - name: Attach the DMG to the Release
        if: env.PUBLISH == 'true'
        run: |
          dmg=$(basename app/build/Sottovoce-*.dmg)
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$dmg"; then
            gh release download "$RELEASE_TAG" --pattern "$dmg" --dir "$RUNNER_TEMP/published"
            (cd "$RUNNER_TEMP/published" && shasum -a 256 "$dmg") > app/build/Sottovoce.sha256
            echo "Kept the DMG already attached; its checksum: $(cat app/build/Sottovoce.sha256)" >> "$GITHUB_STEP_SUMMARY"
          else
            gh release upload "$RELEASE_TAG" "app/build/$dmg"
          fi
          gh release upload "$RELEASE_TAG" app/build/Sottovoce.sha256 --clobber
      # Sparkle's feed goes up last, so installed apps (which read releases/latest/download/appcast.xml) never see an
      # update whose DMG is missing. It is signed over the DMG the Release holds, which may be one an earlier attempt
      # attached
      - name: Publish the update feed
        if: env.PUBLISH == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::Missing repository secret SPARKLE_PRIVATE_KEY: without appcast.xml installed apps won't update to this Release"
            exit 1
          fi
          dmg=$(basename app/build/Sottovoce-*.dmg)
          gh release download "$RELEASE_TAG" --pattern "$dmg" --dir "$RUNNER_TEMP/feed"
          app/appcast.sh "$RELEASE_TAG" "$RUNNER_TEMP/feed/$dmg"
          gh release upload "$RELEASE_TAG" app/build/appcast.xml --clobber
